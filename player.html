<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiles</title>
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-blue-200 text-blue-950 min-h-screen">

    <script type="module" src="./src/player.js"></script>

    <!-- header -->
     <header class="bg-blue-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
             <a href="player.html" class="flex items-center gap-3 text-xl font-bold">
    <i class="fa-solid fa-chess-king text-yellow-400 text-2xl"></i>
    <span>Empereur - Esclave - Citoyen</span>
</a>

            <nav class="hidden md:flex gap-6 text-gray-300">
                <a href="index.html" class="hover:text-yellow-400">Accueil</a>
                <a href="player.html" class="hover:text-yellow-400">profiles</a>
                <a href="game.html" class="hover:text-yellow-400">jouer</a>
                <a href="historique.html" class="hover:text-yellow-400">historique</a>

            </nav>
            <div class="text-sm text-blue-950">
                Gestion des joueurs
            </div>

        </div>

     </header>


     <main class="max-w-7xl mx-auto px-6 py-10">

        <main class="max-w-4xl mx-auto px-6 py-10">

  <h1 class="text-3xl font-bold text-blue-950 mb-8">
    Mon profil
  </h1>

  <section style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpqRt7nAxL2sk-M3PFJXAN1keiuZ86KjTBBIRaboh-Zw&s=10');" class="rounded-xl shadow-md p-8"  >

    <div class="flex flex-col sm:flex-row items-center gap-6">

      <img
        id="profileAvatar"
        src="images/lion.png"
        alt="Avatar"
        class="w-28 h-28 rounded-full object-cover border-4 border-blue-300"
      >

      <div class="text-center sm:text-left">
        <h2 id="profilePseudo" class="text-2xl font-bold text-amber-50">
          Youssef
        </h2>

        <p class="text-white">Joueur</p>
      </div>

    </div>

    <hr class="my-8">

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

      <div class="bg-blue-50 p-5 rounded-lg text-center">
        <p class="text-gray-500">Parties jouées</p>
        <p id="gamesPlayed" class="text-2xl font-bold">0</p>
      </div>

      <div class="bg-green-50 p-5 rounded-lg text-center">
        <p class="text-gray-500">Victoires</p>
        <p id="wins" class="text-2xl font-bold">0</p>
      </div>

      <div class="bg-yellow-50 p-5 rounded-lg text-center">
        <p class="text-gray-500">Points</p>
        <p id="totalPoints" class="text-2xl font-bold">0</p>
      </div>

    </div>

  </section>
</main>
         
        <section class="mb-8">
            
        <h1 class="text-3xl font-bold text-blue-950 mb-3 ">Gestion des joueurs</h1>
        <p class="text-gray-600 mt-2">
            Gérez vos profile de joueurs
        </p>
        </section>
        
        <!-- add player -->

         <section class="bg-white p-6 rounded-xl shadow-md mb-10">
            <h2 class="text-xl font-bold text-blue-950 mb-5">
                Ajouter un jouer
            </h2>
            <form id="playerForm" class="space-y-4">

<div>
    <label for="pseudo" class="block font-semibold mb-4">
        pseudo
    </label>
    <input type="text"
    id="pseudo"
    placeholder="Entrer votre pseudo"
    minlength="3"
    maxlength="15"
    required class="w-full border border-gray-300 rounded-lg px-4 py-3">

</div>

<div>
    <label for="avatar" class="block font-semibold mb-3">
        Choisir un avatar
    </label>
    <select
    id="avatar" class="w-full border border-gray-300 rounded-lg px-4 py-3">
    <option value="./images/avatars/king.png" class="flex gap-2"><img src="./images/">Roi</option>
    <option value="./images/avatars/lion.png" class="flex gap-2"><img src="./images/lion.png">lion</option>
    <option value="./images/avatars/warior.png" class="flex gap-2">guérriie<span><img class="w-5 h-5" src="./images/knight.png"></span></option>
    <option value="./images/avatars/dragon.png" class="flex gap-2"><img src="./images/new.png">dragon</option>

    <p id="ereurMessage" class="text bg-red-500 text-sm"></p>
    <button
    type="submit" class="bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-lg font-semibold">
    Ajouter le joueur

</button>

         </form>
         </section>

         <!-- listes des joueurs -->

         <section>
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xxl font-bold text-blue-950">
                    Liste des joueurs
                </h2>
                <span id="playersCount" class="bg-blue-100 text-blue-800 px-3 py-1 rounded full">
                    0 joueus
                </span>
            </div>
            
            <div id="playersListe" class="gird grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            </div>

         </section>
          
    
     </main>
